<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .t{font-size:13px;fill:#111;font-weight:bold}
      .s{font-size:11px;fill:#555}
      .tool{font-size:10px;fill:#2a6}
      .box{stroke:#444;stroke-width:1.5}
      .flow{stroke:#444;stroke-width:1.8;fill:none;marker-end:url(#a2)}
    </style>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Example workflow — inspect → execute → verify → reproduce</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#666" font-style="italic">LuCa-7color multiplex fluorescence · 5266 cells detected · replayed with no model</text>

  <!-- prompt -->
  <rect class="box" x="30" y="72" width="160" height="52" rx="8" fill="#eef4ff"/>
  <text class="t" x="110" y="94" text-anchor="middle">User prompt</text>
  <text class="s" x="110" y="112" text-anchor="middle">"detect &amp; export…"</text>

  <!-- row of stages -->
  <!-- 1 state -->
  <rect class="box" x="30" y="160" width="180" height="86" rx="8" fill="#e9f7ee"/>
  <text class="t" x="120" y="184" text-anchor="middle">1 · Inspect state</text>
  <text class="s" x="120" y="204" text-anchor="middle">image, viewer, selection,</text>
  <text class="s" x="120" y="219" text-anchor="middle">annotation summary</text>
  <text class="tool" x="120" y="237" text-anchor="middle">get_* (read-only)</text>

  <!-- 2 annotation -->
  <rect class="box" x="240" y="160" width="180" height="86" rx="8" fill="#e9f7ee"/>
  <text class="t" x="330" y="184" text-anchor="middle">2 · Tumor region</text>
  <text class="s" x="330" y="204" text-anchor="middle">select the annotation</text>
  <text class="s" x="330" y="219" text-anchor="middle">to work inside</text>
  <text class="tool" x="330" y="237" text-anchor="middle">select_annotation (W)</text>

  <!-- 3 detection -->
  <rect class="box" x="450" y="160" width="180" height="86" rx="8" fill="#fdeeee"/>
  <text class="t" x="540" y="184" text-anchor="middle">3 · Cell detection</text>
  <text class="s" x="540" y="204" text-anchor="middle">DAPI watershed</text>
  <text class="s" x="540" y="219" text-anchor="middle">0 → 5266 (verified)</text>
  <text class="tool" x="540" y="237" text-anchor="middle">run_cell_detection (D)</text>

  <!-- 4 export -->
  <rect class="box" x="660" y="160" width="180" height="86" rx="8" fill="#fdeeee"/>
  <text class="t" x="750" y="184" text-anchor="middle">4 · Export</text>
  <text class="s" x="750" y="204" text-anchor="middle">measurement table</text>
  <text class="s" x="750" y="219" text-anchor="middle">5266 × 134 → CSV</text>
  <text class="tool" x="750" y="237" text-anchor="middle">export_measurements (D)</text>

  <!-- 5 record+replay -->
  <rect class="box" x="240" y="300" width="420" height="86" rx="8" fill="#eef4ff"/>
  <text class="t" x="450" y="324" text-anchor="middle">5 · Record → save → replay (no LLM)</text>
  <text class="s" x="450" y="344" text-anchor="middle">provenance JSON + runnable Groovy → deterministic replay</text>
  <text class="s" x="450" y="359" text-anchor="middle">reproduces 1 annotation + 5266 detections</text>
  <text class="tool" x="450" y="377" text-anchor="middle">start/stop_recording · export_workflow_json · save_workflow · replay_workflow</text>

  <!-- flows -->
  <path class="flow" d="M110,124 L110,158"/>
  <path class="flow" d="M210,203 L238,203"/>
  <path class="flow" d="M420,203 L448,203"/>
  <path class="flow" d="M630,203 L658,203"/>
  <path class="flow" d="M750,246 C750,275 520,280 460,298"/>
  <path class="flow" d="M240,343 C170,343 150,300 120,248"/>

  <text class="s" x="450" y="418" text-anchor="middle" font-style="italic">Screenshots &amp; JSON-RPC traces for each stage: examples/01–03/</text>
</svg>
