<svg xmlns="http://www.w3.org/2000/svg" width="860" height="700" viewBox="0 0 860 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .lbl{font-size:14px;fill:#111}
      .sub{font-size:11px;fill:#555}
      .band{font-size:12px;fill:#888;font-style:italic}
      .box{stroke:#444;stroke-width:1.5;rx:8}
      .flow{stroke:#444;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">QuPath-MCP — system overview</text>

  <!-- 1 User prompt -->
  <rect class="box" x="330" y="48" width="200" height="46" rx="8" fill="#eef4ff"/>
  <text class="lbl" x="430" y="70" text-anchor="middle">User prompt</text>
  <text class="sub" x="430" y="86" text-anchor="middle">natural language</text>

  <!-- 2 Agent -->
  <rect class="box" x="285" y="124" width="290" height="58" rx="8" fill="#eef4ff"/>
  <text class="lbl" x="430" y="148" text-anchor="middle">MCP agent (model-agnostic)</text>
  <text class="sub" x="430" y="166" text-anchor="middle">Claude Code / Desktop · Codex · Cursor</text>

  <!-- transport -->
  <text class="band" x="600" y="205" text-anchor="middle">Streamable HTTP · 127.0.0.1:9527/mcp</text>

  <!-- 3 Server -->
  <rect class="box" x="150" y="212" width="560" height="188" rx="10" fill="#f6f6f6"/>
  <text class="lbl" x="430" y="234" text-anchor="middle" font-weight="bold">QuPath-MCP server  (Java extension, in QuPath's JVM)</text>

  <!-- tool category boxes -->
  <g>
    <rect class="box" x="168" y="250" width="120" height="60" rx="7" fill="#e9f7ee"/>
    <text class="sub" x="228" y="276" text-anchor="middle">Project &amp;</text>
    <text class="sub" x="228" y="290" text-anchor="middle">image state (R)</text>

    <rect class="box" x="298" y="250" width="120" height="60" rx="7" fill="#e9f7ee"/>
    <text class="sub" x="358" y="276" text-anchor="middle">Annotation</text>
    <text class="sub" x="358" y="290" text-anchor="middle">R / W / D</text>

    <rect class="box" x="428" y="250" width="120" height="60" rx="7" fill="#fdeeee"/>
    <text class="sub" x="488" y="276" text-anchor="middle">Detection &amp;</text>
    <text class="sub" x="488" y="290" text-anchor="middle">measurement (D)</text>

    <rect class="box" x="558" y="250" width="134" height="60" rx="7" fill="#eef4ff"/>
    <text class="sub" x="625" y="276" text-anchor="middle">Provenance &amp;</text>
    <text class="sub" x="625" y="290" text-anchor="middle">replay</text>

    <rect class="box" x="298" y="326" width="250" height="54" rx="7" fill="#fdf6e3"/>
    <text class="sub" x="423" y="349" text-anchor="middle">Script execution (validate / run_script) —</text>
    <text class="sub" x="423" y="365" text-anchor="middle">advanced fallback, gated</text>
  </g>
  <text class="band" x="228" y="326" text-anchor="middle" font-size="10">read-only state tools first</text>

  <!-- 4 QuPath core -->
  <rect class="box" x="150" y="430" width="560" height="96" rx="10" fill="#f0f0f5"/>
  <text class="lbl" x="430" y="452" text-anchor="middle" font-weight="bold">QuPath</text>
  <g class="sub">
    <rect x="168" y="464" width="100" height="46" rx="6" fill="#fff" stroke="#bbb"/>
    <text x="218" y="491" text-anchor="middle">project</text>
    <rect x="278" y="464" width="100" height="46" rx="6" fill="#fff" stroke="#bbb"/>
    <text x="328" y="491" text-anchor="middle">viewer</text>
    <rect x="388" y="464" width="110" height="46" rx="6" fill="#fff" stroke="#bbb"/>
    <text x="443" y="485" text-anchor="middle">annotations /</text>
    <text x="443" y="499" text-anchor="middle">detections</text>
    <rect x="508" y="464" width="184" height="46" rx="6" fill="#fff" stroke="#bbb"/>
    <text x="600" y="491" text-anchor="middle">measurements</text>
  </g>

  <!-- 5 Outputs -->
  <rect class="box" x="150" y="556" width="270" height="58" rx="10" fill="#eef4ff"/>
  <text class="lbl" x="285" y="580" text-anchor="middle">Workflow log (provenance)</text>
  <text class="sub" x="285" y="598" text-anchor="middle">steps + params + Groovy + version</text>

  <rect class="box" x="440" y="556" width="270" height="58" rx="10" fill="#e9f7ee"/>
  <text class="lbl" x="575" y="580" text-anchor="middle">Deterministic replay</text>
  <text class="sub" x="575" y="598" text-anchor="middle">re-runs without the model</text>

  <!-- flows -->
  <path class="flow" d="M430,94 L430,122"/>
  <path class="flow" d="M430,182 L430,210"/>
  <path class="flow" d="M430,400 L430,428"/>
  <path class="flow" d="M430,526 L285,554"/>
  <path class="flow" d="M430,526 L575,554"/>
  <!-- replay back into QuPath -->
  <path class="flow" d="M575,556 C760,520 760,470 712,478" stroke-dasharray="5 4"/>
  <text class="band" x="770" y="520" text-anchor="middle" font-size="10">replay</text>

  <text class="sub" x="430" y="666" text-anchor="middle" font-style="italic">R = read-only · W = write (non-destructive) · D = destructive / runs code / writes files</text>
</svg>
